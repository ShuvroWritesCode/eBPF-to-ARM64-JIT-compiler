name: C/C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test ARM64 JIT
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make build-essential

      - name: Verify architecture
        run: |
          uname -m
          clang --version

      - name: Build project
        run: make clean && make

      - name: Run unit tests
        run: make test-unit

      - name: Run security tests
        run: make test-security

      - name: Run integration tests
        run: make test-integration
